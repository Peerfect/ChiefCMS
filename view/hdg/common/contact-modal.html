<!-- 联系电话弹窗 - 通用组件 -->
<div id="contactModal" class="fixed inset-0 z-[100] hidden">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" id="modalOverlay"></div>
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 relative animate-modalFade">
            <button id="closeModal" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 transition-colors">
                <i data-lucide="x" class="w-5 h-5 text-gray-600"></i>
            </button>
            
            <div class="text-center">
                <div class="w-16 h-16 bg-primary/10 rounded-2xl mx-auto mb-6 flex items-center justify-center">
                    <i data-lucide="phone" class="w-8 h-8 text-primary"></i>
                </div>
                <h3 class="text-2xl font-bold mb-2 text-gray-800">联系电话</h3>
                <p class="text-gray-500 mb-6">我们期待您的来电咨询</p>
                
                <div class="bg-gradient-to-br from-primary/5 to-gold-light/5 rounded-2xl p-6 mb-6">
                   {{@ frag["common:footer:tel"] || '400-8888-8888'}}
                   {{@ frag["worktime"] || '周一至周五: 9:00 - 21:00<br>周六周日: 8:00 - 18:00'}}
                </div>
                
                <a href="tel:13366826071" class="inline-flex items-center justify-center w-full px-6 py-3 bg-primary hover:bg-primary-dark text-white rounded-full font-semibold transition-colors gap-2">
                    <i data-lucide="phone" class="w-5 h-5"></i>
                    立即拨打
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    // 联系电话弹窗通用逻辑
    (function() {
        const contactModal = document.getElementById('contactModal');
        const closeModal = document.getElementById('closeModal');
        const modalOverlay = document.getElementById('modalOverlay');

        // 打开弹窗函数（供外部调用）
        window.openContactModal = function() {
            if (contactModal) {
                contactModal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }
        };

        // 关闭弹窗函数
        function closeContactModal() {
            if (contactModal) {
                contactModal.classList.add('hidden');
                document.body.style.overflow = '';
            }
        }

        // 绑定关闭事件
        if (closeModal) {
            closeModal.addEventListener('click', closeContactModal);
        }

        if (modalOverlay) {
            modalOverlay.addEventListener('click', closeContactModal);
        }

        // ESC 键关闭
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeContactModal();
            }
        });
    })();
</script>
