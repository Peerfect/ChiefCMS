<div id="floatContact" class="fixed right-4 md:right-8 lg:right-12 bottom-16 md:bottom-20 lg:bottom-24 z-50">
    <button id="floatToggle" class="w-12 h-12 md:w-14 md:h-14 lg:w-16 lg:h-16 bg-primary hover:bg-primary-dark rounded-full shadow-lg flex items-center justify-center transition-all transform hover:scale-110">
        <i data-lucide="message-circle" class="w-6 h-6 md:w-7 md:h-7 lg:w-8 lg:h-8 text-white"></i>
    </button>
    
    <div id="floatContent" class="hidden absolute bottom-16 md:bottom-20 lg:bottom-24 right-0 w-64 md:w-72 lg:w-80 bg-white rounded-2xl shadow-2xl p-4 md:p-5 lg:p-6 animate-fadeIn">
        <div class="space-y-4 md:space-y-5">
            <div class="text-center">
                <div class="w-32 h-32 md:w-36 md:h-36 lg:w-40 lg:h-40 mx-auto bg-gray-100 rounded-xl p-2 md:p-3 mb-2">
                    <img src="{{static_url}}img/wechat-qrcode.jpg" alt="微信二维码" class="w-full h-full object-cover">
                </div>
                <p class="text-gray-600 text-xs md:text-sm">扫码添加微信咨询</p>
            </div>
            
           
              <div class="text-center text-gray-500 text-xs md:text-sm">{{@ frag["common:footer:tel"] || '400-8888-8888'}}</div>
            
            <div class="text-center">
                <a href="/contact/index.html" class="inline-block px-5 py-2 md:px-6 md:py-2.5 bg-primary hover:bg-primary-dark text-white rounded-full text-xs md:text-sm font-semibold transition-colors">
                    在线留言
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const floatToggle = document.getElementById('floatToggle');
        const floatContent = document.getElementById('floatContent');
        let isOpen = false;
        
        floatToggle.addEventListener('click', function() {
            isOpen = !isOpen;
            if (isOpen) {
                floatContent.classList.remove('hidden');
                floatToggle.classList.add('bg-primary-dark');
            } else {
                floatContent.classList.add('hidden');
                floatToggle.classList.remove('bg-primary-dark');
            }
        });
        
        document.addEventListener('click', function(e) {
            if (!e.target.closest('#floatContact')) {
                isOpen = false;
                floatContent.classList.add('hidden');
                floatToggle.classList.remove('bg-primary-dark');
            }
        });
    });
</script>

<style>
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .animate-fadeIn {
        animation: fadeIn 0.3s ease-out;
    }
</style>
